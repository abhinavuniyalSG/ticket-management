tags:
  - name: Users
    description: >
      User management endpoints.
      All routes require a valid **Bearer token**.

      **Permission Matrix:**
      | Action | user | admin | super_admin |
      |---|---|---|---|
      | Get all users | ✗ | own dept | ✓ all |
      | Get user by ID | own only | own dept + self | ✓ any |
      | Update user | own (firstName/lastName/contacts only; no password field exists anywhere in this API) | own + dept users | ✓ any |
      | Delete user | own only | own dept + self | ✓ any |
      | Add contact | own only | own only | own only |
      | Update contact | own only | own only | own only |
      | Delete contact | own only | own only | own only |

paths:
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: >
        - **super_admin**: returns all users in the system.
        - **admin**: returns only users in the same department.
        - **user**: `403 Forbidden`.

        ### Available Filters
        All query parameters are optional and can be combined; when more than one
        is provided, results must match **all** of them (AND logic). For an
        `admin`, these filters are applied in addition to (not instead of) the
        existing same-department scoping.
      security:
        - bearerAuth: []
      parameters:
        - name: department
          in: query
          required: false
          description: Filter by department name (case-insensitive exact match)
          schema:
            type: string
            maxLength: 100
          example: Engineering
        - name: firstName
          in: query
          required: false
          description: Filter by first name (case-insensitive partial match)
          schema:
            type: string
            maxLength: 50
          example: John
        - name: role
          in: query
          required: false
          description: Filter by user role
          schema:
            type: string
            enum: [user, admin, super_admin]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Users fetched successfully
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user by ID
      description: >
        - **user**: can only view their own profile.
        - **admin**: can view their own profile and any user in the same department.
        - **super_admin**: can view any user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User details fetched successfully
                  user:
                    $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      tags:
        - Users
      summary: Update a user
      description: >
        **Fields allowed per role:**

        | Field | user | admin | super_admin |
        |---|---|---|---|
        | `firstName` / `lastName` | ✓ (own) | ✓ (own + same dept) | ✓ (any) |
        | `departmentId` | ✗ | ✓ (for others in dept, not self) | ✓ (any) |
        | `role` | ✗ | ✗ | ✓ (any) |
        | `contacts` | ✓ (own) | ✓ (own + same dept) | ✓ (any) |

        > Admins **cannot** change their own `departmentId`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            example:
              firstName: "jane"
              departmentId: "01906c26-1234-7abc-adef-000000000020"
              contacts:
                - contactType: phone
                  contactDetail: "+91-9999999999"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User updated successfully
                  user:
                    $ref: "#/components/schemas/UserPublic"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      tags:
        - Users
      summary: Delete a user
      description: >
        - **user**: can only delete their own account.
        - **admin**: can delete their own account and accounts of users in the same department.
        - **super_admin**: can delete any account.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User deleted successfully
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/contacts:
    post:
      tags:
        - Users
      summary: Add a contact for the authenticated user
      description: >
        Adds a new contact (phone, WhatsApp, or LinkedIn) to the currently
        authenticated user's profile. Each `contactType` + `contactDetail`
        combination must be globally unique.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddContactRequest"
            example:
              contactType: phone
              contactDetail: "+91-9876543210"
      responses:
        "201":
          description: Contact added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contact added successfully
                  contact:
                    $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/contacts/{contactId}:
    patch:
      tags:
        - Users
      summary: Update a contact
      description: >
        Updates an existing contact belonging to the authenticated user.
        At least one of `contactType` or `contactDetail` must be provided.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
            example:
              contactDetail: "+91-9000000000"
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contact updated successfully
                  contact:
                    $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      tags:
        - Users
      summary: Delete a contact
      description: Deletes a specific contact belonging to the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: Contact deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contact deleted successfully
        "400":
          $ref: "#/components/responses/InvalidId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  schemas:
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field must be provided.
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          example: jane
        lastName:
          type: string
          maxLength: 50
          example: doe
        departmentId:
          type: string
          format: uuid
          nullable: true
          example: "01906c26-1234-7abc-adef-000000000020"
        role:
          type: string
          enum: [user, admin, super_admin]
          description: Only super_admin may change a user role.
        contacts:
          type: array
          items:
            type: object
            required:
              - contactType
              - contactDetail
            properties:
              contactType:
                type: string
                enum: [phone, whatsapp, linkedin]
              contactDetail:
                type: string
                maxLength: 500

    AddContactRequest:
      type: object
      additionalProperties: false
      required:
        - contactType
        - contactDetail
      properties:
        contactType:
          type: string
          enum: [phone, whatsapp, linkedin]
          example: phone
        contactDetail:
          type: string
          minLength: 1
          maxLength: 500
          example: "+91-9876543210"

    UpdateContactRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field (contactType or contactDetail) must be provided.
      properties:
        contactType:
          type: string
          enum: [phone, whatsapp, linkedin]
        contactDetail:
          type: string
          minLength: 1
          maxLength: 500
          example: "+91-9000000000"

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: UUIDv7 identifier of the user
      schema:
        type: string
        format: uuid
      example: "01906c26-1234-7abc-adef-000000000001"

    ContactId:
      name: contactId
      in: path
      required: true
      description: UUIDv7 identifier of the contact
      schema:
        type: string
        format: uuid
      example: "01906c26-1234-7abc-adef-000000000010"
