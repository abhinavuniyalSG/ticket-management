tags:
  - name: Dashboard
    description: >
      Read-only ticket analytics endpoints. All routes require a valid **Bearer token**.

      ### Scope by role
      | Role | `GET /dashboard` scope | `GET /dashboard/overview` |
      |---|---|---|
      | `user` | 403 Forbidden | 403 Forbidden |
      | `admin` | Own department only. Supplying `departmentId` is rejected with 403. | 403 Forbidden |
      | `super_admin` | `departmentId` query param scopes to that department; omitted = entire system | System-wide stats only |

      ### Notes
      - `period` (`week`, `month`, or `year`, default `week`) controls the window for `ticketsOverTime`:
        7 daily buckets for `week`, 30 daily buckets for `month`, 12 monthly buckets for `year` (oldest
        first, including buckets with zero activity).
      - `statusDistribution` and `priorityDistribution` always include every enum value, with `count: 0`
        for values that have no matching tickets, and are not affected by `period`.

paths:
  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Get dashboard statistics (role-scoped)
      description: >
        Returns ticket counts, status/priority distributions, and a `period`-windowed activity trend.

        - **admin**: always scoped to the caller's own department. Passing `departmentId` is rejected (403).
        - **super_admin**: pass `departmentId` to scope to a department, or omit it for system-wide stats.
        - **user**: not permitted (403).
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: query
          required: false
          description: >
            Department to scope the statistics to. Only honoured for `super_admin`; an `admin` supplying
            this parameter receives a 403, and it is never used to override an admin's own department.
          schema:
            type: string
            format: uuid
          example: "01906c26-1234-7abc-adef-000000000020"
        - name: period
          in: query
          required: false
          description: Window for `ticketsOverTime`. Defaults to `week`.
          schema:
            type: string
            enum: [week, month, year]
            default: week
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      message:
                        type: string
                        example: Dashboard statistics fetched successfully
                  - $ref: "#/components/schemas/DashboardMetrics"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >
            Forbidden - either the role cannot access the dashboard, an admin supplied `departmentId`,
            or an admin's account is not assigned to a department.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Forbidden: admins cannot filter the dashboard by department"
        "404":
          description: Department not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: Department not found
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard/overview:
    get:
      tags:
        - Dashboard
      summary: Get the system-wide dashboard overview
      description: >
        `super_admin` only. Returns the same dashboard metrics as `GET /dashboard`, computed system-wide
        (never scoped to a department).
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          required: false
          description: Window for `ticketsOverTime`. Defaults to `week`.
          schema:
            type: string
            enum: [week, month, year]
            default: week
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Dashboard overview fetched successfully
                  systemWide:
                    $ref: "#/components/schemas/DashboardMetrics"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  schemas:
    StatusDistributionEntry:
      type: object
      properties:
        status:
          type: string
          enum: [open, assigned, in_progress, reviewed, completed, closed]
        count:
          type: integer
          minimum: 0

    PriorityDistributionEntry:
      type: object
      properties:
        priority:
          type: string
          enum: [low, medium, high, urgent]
        count:
          type: integer
          minimum: 0

    TicketsOverTimeEntry:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-08-26"
        created:
          type: integer
          minimum: 0
        closed:
          type: integer
          minimum: 0

    DashboardMetrics:
      type: object
      properties:
        totalTickets:
          type: integer
          minimum: 0
        openTickets:
          type: integer
          minimum: 0
        assignedTickets:
          type: integer
          minimum: 0
        inProgressTickets:
          type: integer
          minimum: 0
        reviewedTickets:
          type: integer
          minimum: 0
        completedTickets:
          type: integer
          minimum: 0
        closedTickets:
          type: integer
          minimum: 0
        statusDistribution:
          type: array
          items:
            $ref: "#/components/schemas/StatusDistributionEntry"
        priorityDistribution:
          type: array
          items:
            $ref: "#/components/schemas/PriorityDistributionEntry"
        ticketsOverTime:
          type: array
          description: >
            7 entries for `period=week`, 30 for `period=month`, 12 for `period=year`.
          items:
            $ref: "#/components/schemas/TicketsOverTimeEntry"
